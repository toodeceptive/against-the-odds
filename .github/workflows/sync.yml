name: Repository Status

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Capture repository status
        run: |
          set -euo pipefail
          git fetch origin main --quiet

      - name: Status report
        run: |
          echo "## Repository Status" >> $GITHUB_STEP_SUMMARY
          echo "- Branch strategy: main-only (no develop)" >> $GITHUB_STEP_SUMMARY
          echo "- Default branch SHA: $(git rev-parse --short origin/main)" >> $GITHUB_STEP_SUMMARY
          echo "- Workflow mode: manual-only until an external sync target is defined" >> $GITHUB_STEP_SUMMARY
          echo "- Captured at: $(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> $GITHUB_STEP_SUMMARY
